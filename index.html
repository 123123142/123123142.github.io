<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Личный кабинет Мультибота</title>
    <!-- Подключаем библиотеку Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Динамические цвета из темы Telegram */
        body {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: var(--tg-theme-bg-color, #ffffff);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
            color: var(--tg-theme-text-color);
        }

        .balance-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .balance-amount {
            font-size: 28px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #2481cc);
        }

        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.7;
        }

        /* Красивый переключатель (Toggle) для автопродления */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--tg-theme-button-color, #2481cc);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }
    </style>
</head>
<body>

    <!-- Карточка профиля -->
    <div class="card">
        <h2 id="userName">Привет, Имя!</h2>
        <div class="balance-box">
            <div>
                <div style="font-size: 14px; opacity: 0.7;">Твой баланс</div>
                <div class="balance-amount" id="userBalance">0.0 ₽</div>
            </div>
        </div>
        <button class="btn" onclick="sendAction('topup')">💳 Пополнить баланс</button>
    </div>

    <!-- Карточка VPN -->
    <div class="card">
        <h2>🌐 Мой VPN</h2>
        <div style="margin-bottom: 10px;">
            <span style="opacity: 0.7;">Статус: </span>
            <span id="subStatus" style="font-weight: bold;">Нет подписки</span>
        </div>
        
        <div class="setting-row">
            <span>Автопродление (200 ₽/мес)</span>
            <label class="switch">
                <input type="checkbox" id="autoRenewToggle" onchange="toggleRenew()">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Открываем приложение на весь экран

        // Подтягиваем имя пользователя прямо из Телеграма
        if (tg.initDataUnsafe.user) {
            document.getElementById('userName').innerText = 'Привет, ' + tg.initDataUnsafe.user.first_name + '!';
        }

        // Функция отправки данных обратно в бота
        function sendAction(action) {
            // Отправляем текст в бота (бот воспримет это как сообщение от юзера)
            tg.sendData(action); 
        }

        // Функция переключения автопродления
        function toggleRenew() {
            let isChecked = document.getElementById('autoRenewToggle').checked;
            tg.HapticFeedback.impactOccurred('light'); // Вибрация при нажатии
            
            if (isChecked) {
                sendAction('toggle_renew_on');
            } else {
                sendAction('toggle_renew_off');
            }
        }
    </script>
</body>
</html>
