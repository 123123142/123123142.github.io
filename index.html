<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Личный кабинет</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Telegram Theme Variables & Fallbacks */
        :root {
            --tg-bg: var(--tg-theme-bg-color, #0f0f11);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --tg-hint: var(--tg-theme-hint-color, #8e8e93);
            --tg-button: var(--tg-theme-button-color, #007aff);
            --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
            --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
            
            /* Custom Accents */
            --accent-gradient: linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%);
            --accent-glow: rgba(79, 172, 254, 0.4);
            --glass-bg: rgba(var(--tg-secondary-bg-rgb, 28, 28, 30), 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            
            font-family: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--tg-bg);
            color: var(--tg-text);
            min-height: 100vh;
            padding: 24px 20px;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Background decorative glowing orbs */
        .bg-orb-1 {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--tg-button);
            filter: blur(120px);
            opacity: 0.15;
            z-index: -1;
        }
        
        .bg-orb-2 {
            position: fixed;
            bottom: -50px;
            right: -100px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: #8a2be2;
            filter: blur(100px);
            opacity: 0.12;
            z-index: -1;
        }

        /* Animations */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* Header Section */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 32px;
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .avatar-container {
            position: relative;
            animation: float 6s ease-in-out infinite;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            font-weight: 800;
            box-shadow: 0 10px 25px var(--accent-glow);
            transform: rotate(-5deg);
            transition: transform 0.3s ease;
        }
        
        .avatar-container:hover .avatar {
            transform: rotate(0deg) scale(1.05);
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-info h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .user-info p {
            font-size: 14px;
            color: var(--tg-hint);
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .id-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--tg-hint);
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--tg-secondary-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            opacity: 0;
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            overflow: hidden;
        }
        
        /* Stagger animations for cards */
        .glass-card:nth-child(3) { animation-delay: 0.1s; }
        .glass-card:nth-child(4) { animation-delay: 0.2s; }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--tg-hint);
            letter-spacing: 1.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Balance Display */
        .balance-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 28px;
            position: relative;
            z-index: 2;
        }

        .balance-label {
            font-size: 15px;
            color: var(--tg-hint);
            font-weight: 500;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        
        .currency {
            font-size: 24px;
            color: var(--tg-text);
            -webkit-text-fill-color: var(--tg-text);
            opacity: 0.8;
            font-weight: 600;
        }

        /* Modern Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: var(--tg-button);
            color: var(--tg-button-text);
            border: none;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }
        
        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }
        
        .btn:active::after {
            opacity: 1;
        }

        .btn-primary {
            background: var(--tg-button);
            box-shadow: 0 8px 20px rgba(var(--tg-theme-button-color-rgb, 0,122,255), 0.3);
        }

        .btn-stars {
            background: rgba(255, 153, 0, 0.1);
            color: #ff9900;
            border: 1px solid rgba(255, 153, 0, 0.2);
        }
        
        .btn-stars:active {
            background: rgba(255, 153, 0, 0.2);
        }

        /* Settings List */
        .settings-list {
            display: flex;
            flex-direction: column;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(142, 142, 147, 0.1);
        }
        
        .setting-item:first-child { padding-top: 0; }
        .setting-item:last-child { border-bottom: none; padding-bottom: 0; }

        .setting-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .setting-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--tg-text);
        }

        .setting-desc {
            font-size: 14px;
            color: var(--tg-hint);
            font-weight: 400;
        }

        /* Status Badge */
        .status-badge {
            background: rgba(52, 199, 89, 0.15);
            color: #34c759;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-badge::before {
            content: '';
            display: block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #34c759;
            box-shadow: 0 0 8px #34c759;
        }

        .status-badge.inactive {
            background: rgba(255, 59, 48, 0.15);
            color: #ff3b30;
        }
        .status-badge.inactive::before {
            background: #ff3b30;
            box-shadow: 0 0 8px #ff3b30;
        }

        /* Modern iOS Toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 32px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(120, 120, 128, 0.32);
            transition: .4s cubic-bezier(0.25, 0.1, 0.25, 1);
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 28px;
            width: 28px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s cubic-bezier(0.25, 0.1, 0.25, 1);
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        input:checked + .slider {
            background-color: #34c759;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
        
        /* Icon helpers */
        .icon {
            font-size: 20px;
        }
    </style>
</head>
<body>
    
    <div class="bg-orb-1"></div>
    <div class="bg-orb-2"></div>

    <!-- Header Section -->
    <div class="profile-header">
        <div class="avatar-container">
            <div class="avatar" id="avatarLetter">?</div>
        </div>
        <div class="user-info">
            <h1 id="userName">Пользователь</h1>
            <p>Telegram ID: <span class="id-badge" id="userId">...</span></p>
        </div>
    </div>

    <!-- Finance Card -->
    <div class="glass-card">
        <div class="card-header">
            <div class="card-title">
                <span class="icon">💼</span> Финансы
            </div>
        </div>
        
        <div class="balance-wrapper">
            <div class="balance-label">Доступно средств</div>
            <div class="balance-amount">
                0.00 <span class="currency">₽</span>
            </div>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-primary" onclick="triggerTopUp('yookassa')">
                <span class="icon">💳</span> Пополнить картой
            </button>
            <button class="btn btn-stars" onclick="triggerTopUp('stars')">
                <span class="icon">⭐</span> Пополнить Telegram Stars
            </button>
        </div>
    </div>

    <!-- VPN Subscription Card -->
    <div class="glass-card">
        <div class="card-header">
            <div class="card-title">
                <span class="icon">🛡️</span> Услуги VPN
            </div>
        </div>
        
        <div class="settings-list">
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-title">Статус подписки</span>
                    <span class="setting-desc">Нет активной подписки</span>
                </div>
                <div class="status-badge inactive">Неактивен</div>
            </div>
            
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-title">Автопродление</span>
                    <span class="setting-desc">200 ₽ / месяц</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="autoRenew" onchange="toggleAutoRenew()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Expand app to maximum height & setup styling
        tg.expand();
        tg.ready();
        
        // Set header color dynamically to match background
        try {
            tg.setHeaderColor('bg_color');
            tg.setBackgroundColor('bg_color');
        } catch(e) {
            console.log("Color API not supported on this client");
        }

        // Fetch User Data from Telegram SDK
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            
            // Populate Name
            const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ');
            document.getElementById('userName').textContent = fullName || 'Пользователь';
            
            // Populate ID
            document.getElementById('userId').textContent = user.id;
            
            // Populate Avatar Letter (First letter of first name)
            if (user.first_name) {
                document.getElementById('avatarLetter').textContent = user.first_name.charAt(0).toUpperCase();
            }
        }

        // UI Interactions
        function triggerTopUp(method) {
            // Provide haptic feedback
            tg.HapticFeedback.impactOccurred('light');
            
            // Add a small delay for the button animation to complete before closing/sending
            setTimeout(() => {
                if (method === 'yookassa') {
                    tg.sendData('topup_yookassa');
                } else if (method === 'stars') {
                    tg.sendData('topup_stars');
                }
            }, 100);
        }

        function toggleAutoRenew() {
            // Provide haptic feedback for switch toggle
            tg.HapticFeedback.impactOccurred('medium');
            
            const isActive = document.getElementById('autoRenew').checked;
            tg.sendData(isActive ? 'toggle_renew_on' : 'toggle_renew_off');
        }
    </script>
</body>
</html>
